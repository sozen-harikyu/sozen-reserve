<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>銀座そうぜん鍼灸院 ご予約</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    iframe {
      position: fixed;
      top: -48px;
      left: 0;
      width: 100vw;
      height: calc(100vh + 48px);
      height: calc(100dvh + 48px);
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="gas-frame" allow="geolocation"></iframe>

  <script>
    // 現在のGASのウェブアプリURL
    const baseGasUrl = "https://script.google.com/macros/s/AKfycbzC0GNYQv17835U9S73zAp0sRkoP3KP9xGQg65IB0U6GJcwOCfuyv9asgyOKQuxrck5BA/exec";
    // URLの後ろについた ?action=cancel&key=... をそのままGAS側へ引き継ぐ
    const params = window.location.search;
    document.getElementById("gas-frame").src = baseGasUrl + params;
  </script>
</body>
</html>
